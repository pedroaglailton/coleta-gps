<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coleta GPS Câmeras</title>
<style>
:root{--bg:#10151a;--sf:#1a222a;--ln:#2c3844;--tx:#e8eef3;--mt:#8fa1b0;--ac:#ffb020;--ok:#3ecf8e;--er:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1{font-size:19px;margin:16px 0 12px;letter-spacing:.2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mt);margin-bottom:6px}
input{width:100%;font-size:18px;padding:13px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
input:focus{outline:2px solid var(--ac);border-color:transparent}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:14px;background:var(--ln);color:var(--tx);cursor:pointer;width:100%}
button:active{transform:scale(.98)}
.main{background:var(--ac);color:#1b1300;font-size:18px;padding:17px;margin-top:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg4{grid-template-columns:repeat(2,1fr)}
.seg button{padding:12px 6px;font-size:15px;background:var(--bg);border:1px solid var(--ln);line-height:1.25}
.seg button b{display:block;font-size:20px;color:var(--ac)}
.seg button.on{background:var(--ac);color:#1b1300;border-color:var(--ac)}
.seg button.on b{color:#1b1300}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.gps{margin-top:12px;font-size:14px;color:var(--mt);line-height:1.5;min-height:42px}
.gps b{color:var(--tx);font-variant-numeric:tabular-nums}
.good{color:var(--ok)}.bad{color:var(--er)}
.item{border-top:1px solid var(--ln);padding:11px 0;display:flex;gap:10px;align-items:center}
.item:first-child{border-top:0}
.item .i{flex:1;min-width:0}
.item .n{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.item .c{font-size:13px;color:var(--mt);font-variant-numeric:tabular-nums}
.item button{width:auto;padding:9px 12px;background:transparent;color:var(--er);border:1px solid var(--ln)}
.item .e{color:var(--tx)}
.empty{color:var(--mt);font-size:14px;padding:6px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
textarea{width:100%;min-height:110px;margin-top:8px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;font:13px ui-monospace,Consolas,monospace}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<h1>Coleta de coordenadas</h1>

<div class="card">
  <label>Local</label>
  <div class="seg" id="segL"></div>
  <label style="margin-top:12px">Tipo de câmera</label>
  <div class="seg seg4" id="segT"></div>
  <div id="boxSub" style="display:none;margin-top:12px">
    <label>Contexto: é Dome ou Bullet?</label>
    <div class="seg seg4" id="segS"></div>
  </div>
  <div class="row" style="margin-top:12px">
    <div><label for="num">Número</label><input id="num" type="number" inputmode="numeric" min="1" max="999"></div>
    <div><label for="nome">Nome da câmera</label><input id="nome" autocomplete="off" autocapitalize="characters"></div>
  </div>
  <button class="main" id="salvar">Capturar localização e salvar</button>
  <div class="gps" id="gps">Aguardando captura…</div>
</div>

<div class="card">
  <label>Registros salvos (<span id="qtd">0</span>)</label>
  <div id="lista"></div>
</div>

<div class="card">
  <button class="main" id="whats" style="margin-top:0;background:var(--ok)">Enviar pelo WhatsApp</button>
  <div class="row">
    <button id="compartilhar">Enviar TXT</button>
    <button id="baixar">Baixar TXT</button>
  </div>
  <div class="row">
    <button id="copiar">Copiar texto</button>
    <button id="limpar" style="color:var(--er)">Apagar tudo</button>
  </div>
  <textarea id="previa" readonly></textarea>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var KEY="coleta_gps_cameras_v1";
  var $=function(i){return document.getElementById(i)};
  var dados=[];
  try{dados=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){dados=[]}

  var PREFIXO="FB";
  var LOCAIS={P:"Parque",E:"Estádio",T:"Tauá"};
  var TIPOS={F:"Facial",Z:"PTZ",R:"LPR",C:"Contexto"};
  var SUBS={D:"Dome",B:"Bullet"};
  var selL="P",selT="F",selS=null;

  function montarSeg(id,mapa,get,set){
    var box=$(id);box.innerHTML="";
    Object.keys(mapa).forEach(function(k){
      var b=document.createElement("button");b.type="button";b.dataset.k=k;
      b.innerHTML="<b>"+k+"</b>"+mapa[k];
      b.onclick=function(){set(k);atualizar()};
      box.appendChild(b);
    });
  }
  function marcar(){
    Array.prototype.forEach.call($("segL").children,function(b){b.className=b.dataset.k===selL?"on":""});
    Array.prototype.forEach.call($("segT").children,function(b){b.className=b.dataset.k===selT?"on":""});
    if(selT!=="C")selS=null;
    $("boxSub").style.display=selT==="C"?"block":"none";
    Array.prototype.forEach.call($("segS").children,function(b){b.className=b.dataset.k===selS?"on":""});
  }
  function pref(){return PREFIXO+selL+selT+(selT==="C"&&selS?selS:"")}
  function proximo(){
    var pre=pref(),max=0;
    dados.forEach(function(r){
      var m=String(r.nome||"").toUpperCase().match(/^(.*?)(\d+)$/);
      if(m&&m[1]===pre)max=Math.max(max,parseInt(m[2],10));
    });
    return max+1;
  }
  function compor(){
    var n=parseInt($("num").value,10);if(!(n>0))n=1;
    $("nome").value=pref()+String(n).padStart(3,"0");
  }
  function atualizar(){$("num").value=proximo();compor();marcar()}

  function salvarLS(){try{localStorage.setItem(KEY,JSON.stringify(dados))}catch(e){toast("Falha ao gravar no aparelho")}}
  function toast(m){var t=$("toast");t.textContent=m;t.className="toast on";clearTimeout(toast.h);toast.h=setTimeout(function(){t.className="toast"},1800)}
  function pad(n){return String(n).padStart(2,"0")}
  function fmtData(ts){var d=new Date(ts);return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())}
  function linha(r){return r.nome+";"+(r.local||"")+";"+(r.tipo||"")+";"+(r.subtipo||"")+";"+r.lat.toFixed(7)+";"+r.lng.toFixed(7)+";"+Math.round(r.acc)+"m;"+fmtData(r.ts)}

  function texto(){
    var h="NOME;LOCAL;TIPO;SUBTIPO;LATITUDE;LONGITUDE;PRECISAO;DATA_HORA\n";
    return h+dados.map(linha).join("\n")+"\n";
  }

  function render(){
    $("qtd").textContent=dados.length;
    var L=$("lista");L.innerHTML="";
    if(!dados.length){L.innerHTML='<div class="empty">Nenhum registro ainda.</div>'}
    dados.slice().reverse().forEach(function(r,idx){
      var real=dados.length-1-idx;
      var d=document.createElement("div");d.className="item";
      var i=document.createElement("div");i.className="i";
      var n=document.createElement("div");n.className="n";n.textContent=r.nome;
      var c=document.createElement("div");c.className="c";
      c.textContent=[r.local,r.tipo,r.subtipo].filter(Boolean).join(" / ")+(r.local||r.tipo?"  ":"")+r.lat.toFixed(6)+", "+r.lng.toFixed(6)+"  ±"+Math.round(r.acc)+"m";
      i.appendChild(n);i.appendChild(c);
      var b=document.createElement("button");b.textContent="Excluir";
      b.onclick=function(){if(confirm("Excluir "+r.nome+"?")){dados.splice(real,1);salvarLS();render()}};
      d.appendChild(i);d.appendChild(b);L.appendChild(d);
    });
    $("previa").value=texto();
  }

  function capturar(cb){
    if(!navigator.geolocation){cb(null,"Este navegador não tem GPS.");return}
    var melhor=null,fim=false,w;
    var limite=setTimeout(function(){finalizar()},12000);
    function finalizar(){
      if(fim)return;fim=true;clearTimeout(limite);
      if(w!=null)navigator.geolocation.clearWatch(w);
      melhor?cb(melhor):cb(null,"Sem sinal de GPS. Vá para área aberta e tente de novo.");
    }
    w=navigator.geolocation.watchPosition(function(p){
      $("gps").innerHTML="Lendo GPS… precisão <b>±"+Math.round(p.coords.accuracy)+" m</b>";
      if(!melhor||p.coords.accuracy<melhor.acc){
        melhor={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
      }
      if(p.coords.accuracy<=5)finalizar();
    },function(e){
      if(e.code===1){fim=true;clearTimeout(limite);cb(null,"Permissão de localização negada. Libere nas configurações do navegador.")}
      else if(!melhor){/* aguarda timeout */}
    },{enableHighAccuracy:true,maximumAge:0,timeout:15000});
  }

  $("salvar").onclick=function(){
    var nome=$("nome").value.trim();
    if(!nome){toast("Digite o nome da câmera");$("nome").focus();return}
    nome=nome.replace(/[;\n\r]+/g," ");
    var tipo=TIPOS[selT],local=LOCAIS[selL],sub=selT==="C"?SUBS[selS]:"";
    if(selT==="C"&&!selS){toast("Escolha Dome ou Bullet");return}
    var btn=$("salvar");btn.disabled=true;btn.textContent="Capturando…";
    $("gps").textContent="Buscando satélites…";
    capturar(function(pos,erro){
      btn.disabled=false;btn.textContent="Capturar localização e salvar";
      if(!pos){$("gps").innerHTML='<span class="bad">'+erro+'</span>';return}
      dados.push({nome:nome,local:local,tipo:tipo,subtipo:sub,lat:pos.lat,lng:pos.lng,acc:pos.acc,ts:Date.now()});
      salvarLS();render();
      var cl=pos.acc<=10?"good":"";
      $("gps").innerHTML='Salvo: <b>'+nome.replace(/</g,"&lt;")+'</b>'+' ('+local+' / '+tipo+(sub?' / '+sub:'')+')'+'<br>'+pos.lat.toFixed(7)+', '+pos.lng.toFixed(7)+' <span class="'+cl+'">±'+Math.round(pos.acc)+' m</span>';
      selS=null;atualizar();
      if(navigator.vibrate)navigator.vibrate(60);
    });
  };

  function arquivo(){
    var nm="cameras_"+new Date().toISOString().slice(0,10)+".txt";
    return new File([texto()],nm,{type:"text/plain"});
  }

  $("compartilhar").onclick=function(){
    if(!dados.length){toast("Nada para enviar");return}
    var f=arquivo();
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:"Coordenadas das câmeras"}).catch(function(){});
    }else if(navigator.share){
      navigator.share({title:"Coordenadas das câmeras",text:texto()}).catch(function(){});
    }else{toast("Compartilhar indisponível. Use Baixar ou Copiar.")}
  };

  /* Número que recebe os dados, com código do país e DDD, só dígitos.
     Exemplo: "5585999999999". Deixe vazio para escolher o contato na hora. */
  var NUMERO_WHATSAPP="";

  $("whats").onclick=function(){
    if(!dados.length){toast("Nada para enviar");return}
    var msg=encodeURIComponent(texto());
    if(msg.length>6000){toast("Muitos registros. Use Enviar TXT.");return}
    var num=String(NUMERO_WHATSAPP||"").replace(/\D/g,"");
    window.location.href="https://wa.me/"+num+"?text="+msg;
  };

  $("baixar").onclick=function(){
    if(!dados.length){toast("Nada para baixar");return}
    var f=arquivo();var a=document.createElement("a");
    a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
    toast("TXT baixado");
  };

  $("copiar").onclick=function(){
    var t=texto();
    function fallback(){var ta=$("previa");ta.select();try{document.execCommand("copy");toast("Copiado")}catch(e){toast("Selecione e copie manualmente")}}
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(function(){toast("Copiado")},fallback)}else fallback();
  };

  $("limpar").onclick=function(){
    if(dados.length&&confirm("Apagar TODOS os "+dados.length+" registros?")){dados=[];salvarLS();render()}
  };

  montarSeg("segL",LOCAIS,null,function(k){selL=k});
  montarSeg("segT",TIPOS,null,function(k){selT=k});
  montarSeg("segS",SUBS,null,function(k){selS=k});
  $("num").oninput=compor;
  atualizar();
  render();
})();
</script>
</body>
</html>
